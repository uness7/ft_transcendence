services:
  db:
    container_name: db
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    container_name: web
    env_file:
      - ./.env.prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    restart: unless-stopped
    depends_on:
      - db

  nginx:
    build:
      context: . 
      dockerfile: Dockerfile  
    ports:
      - "8443:8443"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
